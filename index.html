<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopify</title>

<style>
:root {
    --color-primary: #1E3A5F;
    --color-accent: #2563EB;
    --color-cta: #F97316;
    --color-bg: #F8FAFC;
    --color-surface: #FFFFFF;
    --color-border: #E2E8F0;
    --color-text: #0F172A;
    --color-muted: #64748B;
    --color-price: #16A34A;
}

body {
    margin: 0;
    font-family: sans-serif;
    background: var(--color-bg);
    color: var(--color-text);
}

/* NAVBAR */
header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--color-primary);
    padding: 20px 40px;
    color: white;
}

nav a {
    color: white;
    margin-left: 25px;
    text-decoration: none;
    font-size: 16px;
}

nav a:hover {
    text-decoration: underline;
}

/* HERO */
.hero {
    text-align: center;
    padding: 60px 20px;
    background: var(--color-primary);
    color: white;
}

.btn {
    margin-top: 20px;
    padding: 12px 25px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    font-size: 16px;
    transition: 0.3s;
}

.btn-primary {
    background: var(--color-cta);
    color: white;
}

.btn-primary:hover {
    transform: scale(1.05);
}

/* PRODUCTS */
.container {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
    padding: 20px;
}

.card {
    width: 250px;
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: 10px;
    text-align: center;
    padding: 15px;
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-5px);
}

.card img {
    width: 100%;
    border-radius: 8px;
}

.price {
    color: var(--color-price);
    font-weight: bold;
}

footer {
    text-align: center;
    padding: 20px;
    background: var(--color-primary);
    color: white;
}
</style>
</head>

<body>

<header>
    <h1>Shopify</h1>
    <nav>
        <a href="home.html">Home</a>
        <a href="contact.html">Contact</a>
        <a href="cart.html">Cart</a>
    </nav>
</header>

<section class="hero">
    <h2>Welcome to Shopify</h2>
    <button class="btn btn-primary">Shop Now</button>
</section>

<h2 style="text-align:center;">Featured Products</h2>

<div class="container">

    <div class="card">
        <img src="image.jpeg">
        <p>Product 1</p>
        <p class="price">$19.99</p>
        <button class="btn btn-primary">Buy Now</button>
    </div>

    <div class="card">
        <img src="image.jpeg">
        <p>Product 2</p>
        <p class="price">$10.99</p>
        <button class="btn btn-primary">Buy Now</button>
    </div>

    <div class="card">
        <img src="image.jpeg">
        <p>Product 3</p>
        <p class="price">$10.99</p>
        <button class="btn btn-primary">Buy Now</button>
    </div>

    <div class="card">
        <img src="image.jpeg">
        <p>Product 4</p>
        <p class="price">$10.99</p>
        <button class="btn btn-primary">Buy Now</button>
    </div>

</div>

<footer>
    © 2026 Shopify | Made by Aakshi
</footer>

</body>
</html>
